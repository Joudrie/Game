button:hover { border-color: var(--ink-soft); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--ink); background: var(--key); }

#top { top: calc(var(--s4) + env(safe-area-inset-top, 0px)); left: var(--s4); right: var(--s4); display: flex; gap: var(--s2); align-items: flex-start; pointer-events: none; }
#top > * { pointer-events: auto; }
#classchip { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: var(--s2) var(--s3); line-height: 1.25; }
#classchip b { font-weight: 700; font-size: 12px; }
#classchip span { color: var(--ink-soft); font-size: 11px; font-family: var(--font-mono); }

#readout { bottom: calc(var(--s4) + env(safe-area-inset-bottom, 0px)); left: var(--s4); font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; padding: var(--s2) var(--s3); }
#readout .gait.hot { color: var(--signal); }
#help { bottom: calc(var(--s4) + env(safe-area-inset-bottom, 0px)); right: var(--s4); padding: var(--s2) var(--s3); color: var(--ink-soft); white-space: nowrap; }
#help kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink); background: var(--key); border: 1px solid var(--line); border-radius: 3px; padding: 0 var(--s1); }
@media (max-width: 1240px) { #help { display: none; } }
#toast { top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: var(--s2) var(--s3); max-width: calc(100vw - 32px); text-align: center; }

#loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #ffffff; font-size: 13px; color: var(--ink-soft); padding: 0 var(--s4); text-align: center; }

@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* touch */
#joy { position: fixed; z-index: 3; width: 112px; height: 112px; margin: -56px 0 0 -56px; border: 1px solid var(--line); border-radius: 50%; background: rgba(255,255,255,.55); pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--ink); opacity: .7; }
#joy.sprint i { background: var(--signal); opacity: .9; }
#pad { bottom: calc(var(--s6) + env(safe-area-inset-bottom, 0px)); right: var(--s4); display: none; gap: var(--s3); align-items: flex-end; }

/* Moves sheet */

.row { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r); margin-bottom: var(--s2); }
.row.previewing { border-color: var(--ink); }
.row .pv { flex: 1; min-width: 0; text-align: left; border: 0; border-radius: var(--r) 0 0 var(--r); padding: var(--s3); display: flex; flex-direction: column; gap: 2px; background: transparent; line-height: 1.3; min-height: 48px; }
.row .pv b { font-weight: 500; font-size: 13px; }
.row .pv span { font: 400 11px var(--font-mono); color: var(--ink-soft); overflow-wrap: anywhere; }
.row label { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); border-left: 1px solid var(--line); font-size: 11px; color: var(--ink-soft); cursor: pointer; min-width: 92px; }
.row input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.lib { display: flex; flex-wrap: wrap; gap: var(--s2); }
.lib button.on { border-color: var(--ink); background: var(--key); }
.note { font-size: 12px; color: var(--ink-soft); margin: var(--s2) 0 0; line-height: 1.5; }
#pvlabel { top: calc(var(--s4) + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: var(--s2) var(--s3); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 820px) { #pvlabel { left: calc(50% - 200px); } }
body.moves-open #top, body.moves-open #readout, body.moves-open #pad, body.moves-open #help { display: none !important; }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.__booted = true;

const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));

const COARSE = matchMedia('(pointer: coarse)').matches;

// ---------------- classes (your rules) ----------------
const CLASSES = {
  light: { label: 'Light infantry', who: 'Soldiers, suits, civilians', health: 150,
           walk: 1.6, jog: 4.6, sprint: 7.0, jump: 4.8, doubleJump: false, slideTime: 0.85, slideBoost: 1.1 },
  force: { label: 'Ultralight (Force)', who: 'Anyone with a lightsaber', health: 100,
           walk: 1.7, jog: 5.4, sprint: 10.5, jump: 5.4, doubleJump: true, djump: 6.0, slideTime: 1.15, slideBoost: 1.15 },
  heavy: { label: 'Heavy infantry', who: 'Heavy armour, miniguns', health: 250,
           walk: 1.4, jog: 3.9, sprint: 5.8, jump: 4.0, doubleJump: false, slideTime: 0.6, slideBoost: 1.0 },
};

// ---------------- moves catalogue ----------------
// Each slot lists every variant we have. Ticked variants rotate in play.
const SRC_UAL = 'Quaternius UAL · CC0';
const MOVES = {
  idle:   { label: 'Idle', when: 'A different one each time you stop', variants: [
    { id: 'Idle_Loop', label: 'Standard', src: SRC_UAL },
    { id: 'Idle_FoldArms_Loop', label: 'Arms folded', src: SRC_UAL },
    { id: 'Idle_Talking_Loop', label: 'Talking', src: SRC_UAL } ] },
  walk:   { label: 'Walk', when: 'Changes each time you start walking', variants: [
    { id: 'Walk_Loop', label: 'Standard', src: SRC_UAL },
    { id: 'Walk_Formal_Loop', label: 'Formal', src: SRC_UAL } ] },
  jog:    { label: 'Run', when: 'Changes each time you start running', variants: [
    { id: 'Jog_Fwd_Loop', label: 'Jog', src: SRC_UAL } ] },
  sprint: { label: 'Sprint', when: 'Changes each time you start sprinting', variants: [
    { id: 'Sprint_Loop', label: 'Sprint', src: SRC_UAL } ] },
  slide:  { label: 'Slide', when: 'First ticked = normal. Second ticked = after 3 s of sprinting', variants: [
    { id: 'slide_ual', label: 'Baseball slide', src: SRC_UAL, seq: ['Slide_Start', 'Slide_Loop', 'Slide_Exit'] } ] },
  jump:   { label: 'Jump', when: 'Rotates each jump', variants: [
    { id: 'jump_ual', label: 'Standard', src: SRC_UAL, seq: ['Jump_Start', 'Jump_Loop', 'Jump_Land'] } ] },
  crouch: { label: 'Crouch walk', when: 'Press C (or Slide) while standing still. Changes each time you move off', variants: [
    { id: 'Crouch_Fwd_Loop', label: 'Standard', src: SRC_UAL } ] },
  stance: { label: 'Saber stance', when: 'Held while the saber is out. Changes each time you stop', variants: [
    { id: 'Sword_Idle', label: 'One-handed ready', src: SRC_UAL },
    { id: 'STANCE_HighGuard', label: 'High guard', src: SRC_UAL + ' (block pose, held)' },
    { id: 'STANCE_Lunge', label: 'Low lunge', src: SRC_UAL + ' (dash pose, held)' } ] },
  djump:  { label: 'Double jump', when: 'Force users only. Rotates each use', variants: [
    { id: 'djump_ninja', label: 'Ninja flip', src: SRC_UAL, seq: ['NinjaJump_Start', 'NinjaJump_Idle_Loop', 'NinjaJump_Land'] } ] },
};
const LIBRARY = ['Roll', 'ClimbUp_1m', 'Crouch_Idle_Loop', 'Crouch_Fwd_Loop', 'Sword_Idle', 'Sword_Attack', 'Sword_Block', 'Sword_Dash',
  'Sword_Regular_A', 'Sword_Regular_B', 'Sword_Regular_C', 'Sword_Regular_Combo', 'Sword_Heavy_Combo', 'Shield_Dash',
  'Pistol_Idle_Loop', 'Pistol_Shoot', 'Pistol_Reload', 'Punch_Jab', 'Punch_Cross', 'Melee_Hook', 'OverhandThrow',
  'Spell_Simple_Shoot', 'Hit_Chest', 'Hit_Knockback', 'Death01', 'Dance_Loop'];

// extra variants baked offline (retargeted Mixamo / mocap), injected at build time
const EXTRA = window.__ASSETS.extra || { clips: [], moves: {} };
for (const [slot, list] of Object.entries(EXTRA.moves || {})) MOVES[slot]?.variants.push(...list);
LIBRARY.push(...(EXTRA.library || []));

// ticked state per slot (remembered on this device)
const pool = {};
let saved = {};
try { saved = JSON.parse(localStorage.getItem('moves-pool') || '{}'); } catch (_) {}
for (const [slot, m] of Object.entries(MOVES)) {
  const ids = m.variants.map((v) => v.id);
  const s = (saved[slot] || []).filter((id) => ids.includes(id));
  pool[slot] = s.length ? s : [ids[0]];
}
const savePool = () => { try { localStorage.setItem('moves-pool', JSON.stringify(pool)); } catch (_) {} };
let klass = 'light';
try { const k = localStorage.getItem('moves-class'); if (CLASSES[k]) klass = k; } catch (_) {}
const rot = {};  // rotation cursor per slot
function nextVariant(slot) {
  const p = pool[slot]; rot[slot] = ((rot[slot] ?? -1) + 1) % p.length;
  return MOVES[slot].variants.find((v) => v.id === p[rot[slot]]);
}
const variantById = (slot, id) => MOVES[slot].variants.find((v) => v.id === id);

// ---------------- renderer / world ----------------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.domElement.tabIndex = 0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0xffffff);
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 35, 260);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const SUN_OFFSET = new V3(6, 14, 4);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: 0x9a9a9a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(200, 200, 0x6f6f6f, 0x7f7f7f);
grid.material.transparent = true; grid.material.opacity = 0.35; grid.position.y = 0.002; grid.visible = false; scene.add(grid);

let viewShift = { x: 0, y: 0 };
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (viewShift.x || viewShift.y) camera.setViewOffset(w, h, viewShift.x * w, viewShift.y * h, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

// ---------------- load ----------------
function decodeB64(b64) { const bin = atob(b64), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.buffer; }
const loader = new GLTFLoader();
const parseGLB = (b64) => new Promise((res, rej) => loader.parse(decodeB64(b64), '', res, rej));

const player = new THREE.Group(), lean = new THREE.Group();
player.add(lean); scene.add(player);
let hero, mixer, lf, rf;
const clips = new Map();
const cal = {};  // per clip: { speed, dur, strike }

function boneByName(root, name) { let b = null; root.traverse((o) => { if (!b && o.name === name) b = o; }); return b; }

function analyzeClip(root, clip) {
  const m = new THREE.AnimationMixer(root), a = m.clipAction(clip); a.play();
  const N = 90, dt = clip.duration / N, L = [], R = [];
  for (let i = 0; i < N; i++) { m.setTime(i * dt); root.updateMatrixWorld(true); L.push(lf.getWorldPosition(new V3())); R.push(rf.getWorldPosition(new V3())); }
  a.stop(); m.uncacheRoot(root);
  let minY = Infinity; for (let i = 0; i < N; i++) minY = Math.min(minY, L[i].y, R[i].y);
  const vx = [], vz = [];
  for (let i = 0; i < N; i++) {
    const f = L[i].y < R[i].y ? L : R; if (f[i].y > minY + 0.035) continue;
    const p = f[(i + 1) % N], q = f[(i - 1 + N) % N];
    vx.push((p.x - q.x) / (2 * dt)); vz.push((p.z - q.z) / (2 * dt));
  }
  const med = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : 0; };
  const slide = new V3(med(vx), 0, med(vz)), speed = slide.length();
  const fwd = speed > 1e-4 ? slide.clone().negate().normalize() : new V3(0, 0, 1);
  let best = -Infinity, strike = 0;
  L.forEach((p, i) => { const d = p.x * fwd.x + p.z * fwd.z; if (d > best) { best = d; strike = i / N; } });
  return { speed, fwd, strike, dur: clip.duration };
}

async function boot() {
  const A = window.__ASSETS;
  const [h, u1, u2] = await Promise.all([parseGLB(A.hero), parseGLB(A.ual1), parseGLB(A.ual2)]);
  for (const c of [...u1.animations, ...u2.animations]) clips.set(c.name, c);
  for (const j of (EXTRA.clips || [])) { const c = THREE.AnimationClip.parse(j); clips.set(c.name, c); }
  hero = h.scene;
  hero.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  lf = boneByName(hero, 'ball_l') || boneByName(hero, 'foot_l'); rf = boneByName(hero, 'ball_r') || boneByName(hero, 'foot_r');
  // height to 1.8 m, feet on the ground
  hero.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(hero);
  hero.scale.setScalar(1.8 / (box.max.y - box.min.y));
  hero.updateMatrixWorld(true); box.setFromObject(hero); hero.position.y = -box.min.y; hero.updateMatrixWorld(true);
  // measure stride speed of every locomotion loop so feet stay planted
  const DEF = { walk: 1.5, jog: 5, sprint: 8, crouch: 1.2 };
  for (const slot of ['walk', 'jog', 'sprint', 'crouch']) {
    const list = MOVES[slot].variants;
    for (const v of list) {
      const c = clips.get(v.id); if (!c) continue;
      const r = analyzeClip(hero, c);
      if (!(r.speed > 0.3 && r.speed < 14)) r.speed = DEF[slot];
      cal[v.id] = r;
    }
  }
  const f = cal.Walk_Loop?.fwd || new V3(0, 0, 1);
  hero.rotation.y = -Math.atan2(f.x, f.z);
  lean.add(hero);
  poseClip('Sword_Block', 0.45, 'STANCE_HighGuard');
  poseClip('Sword_Dash', 0.35, 'STANCE_Lunge');
  computeMounts(); rebuildSabers();
  mixer = new THREE.AnimationMixer(hero);
  mixer.addEventListener('finished', onFinished);
  window.__cal = Object.fromEntries(Object.entries(cal).map(([k, v]) => [k, +v.speed.toFixed(2)]));
  $('loading').hidden = true;
  renderClass(); buildMoves();
  start();
}
boot().catch((e) => { console.error(e); $('loadmsg').textContent = 'The character failed to load: ' + (e.message || e); document.querySelector('#loading .bar').hidden = true; });

// ---------------- animation layers ----------------
const actions = new Map();
function act(name) {
  let a = actions.get(name);
  if (!a) { const c = clips.get(name); if (!c) return null; a = mixer.clipAction(c); actions.set(name, a); }
  return a;
}
// locomotion: phase-synced loops whose weights we set every frame
const loco = { idle: null, walk: null, jog: null, sprint: null };

function readInput(dt) {

}

    vy = C.djump; jumps = 2; airVar = nextVariant('djump');
    const [s0, s1] = airVar.seq;
    playOvr(s0, { from: airVar.from ?? 0.05, speed: airVar.speed ?? 1.25, fade: 0.08, then: () => { if (mode === 'air') playOvr(s1, { loop: true, fade: 0.2 }); } });

  slideVar = variantById('slide', id);
  mode = 'slide'; slideT = 0; slideDur = C.slideTime;
  slideSpeed = Math.max(speed, C.jog) * C.slideBoost;

function step(dt) {
  const inp = readInput(dt);

    else if (inp.analog) {

  if (atk) target = Math.min(target, 1.0);                   // swings commit you

  if (mode === 'ground') {
    const up = target > speed;
    const a = up ? (speed > C.jog ? 6 : 9) : 13;
    speed = moveTo(speed, target, a * dt);
    sprintTime = speed > C.jog + 0.2 ? sprintTime + dt : 0;
  } else if (mode === 'slide') {
    slideT += dt;
    const k = slideT / slideDur;
    speed = slideSpeed * (1 - 0.55 * k * k);
    if (slideT >= slideDur) endSlide();
  }
  player.position.x += Math.sin(yaw) * speed * dt;
  player.position.z += Math.cos(yaw) * speed * dt;
  if (mode === 'air') {
    vy -= 14 * dt; player.position.y += vy * dt;
    if (player.position.y <= 0) land();
  }
  player.rotation.y = yaw;
  roll = damp(roll, mode === 'ground' ? clamp(-yawVel * speed * 0.02, -0.14, 0.14) : 0, 8, dt);
  lean.rotation.z = roll;

  updateCombat(dt);
  updateSaber(dt);
  animateLoco(dt, C);
  updateCamera(dt, C);
  hud(C);
  sun.position.copy(player.position).add(SUN_OFFSET); sun.target.position.copy(player.position);
  grid.position.x = Math.round(player.position.x); grid.position.z = Math.round(player.position.z);
}

function gaitOf(C) {
  if (crouch) return speed > 0.05 ? 'crouchwalk' : 'crouch';
  if (speed < 0.05) return 'idle';
  if (speed <= C.walk + 0.05) return 'walk';
  if (speed <= C.jog + 0.05) return 'jog';
  return 'sprint';
}

// gait cycles per second: match stride to ground speed, within a believable playback range
function cyc(id, s) { const c = cal[id]; return c ? clamp(s / (c.speed * c.dur), 0.7 / c.dur, 1.6 / c.dur) : 1; }
function animateLoco(dt, C) {
  gait = gaitOf(C);
  // rotate variants when you enter a gait from below or from a stop
  const order = { idle: 0, crouch: 0, crouchwalk: 1, walk: 1, jog: 2, sprint: 3 };
  if (gait !== prevGait) {
    const slot = gait === 'crouchwalk' ? 'crouch' : gait;
    if (gait === 'idle' || (order[gait] > order[prevGait] && MOVES[slot])) cur[slot] = nextVariant(slot).id;
    if (gait === 'idle') cur.stance = nextVariant('stance').id;
    prevGait = gait;
  }
  const wts = new Map();
  let rate = 1;
  const add = (id, w) => { if (w > 0.001) wts.set(id, (wts.get(id) || 0) + w); };
  if (crouch) {
    const t = clamp(speed / 1.8, 0, 1);
    add('Crouch_Idle_Loop', 1 - t); add(cur.crouch, t);
    rate = cyc(cur.crouch, Math.max(speed, 0.9));
  } else if (speed < C.walk) {
    const t = speed / C.walk; add(cur.idle, 1 - t); add(cur.walk, t);
    rate = cyc(cur.walk, Math.max(speed, C.walk * 0.6));
  } else if (speed < C.jog) {
    const t = (speed - C.walk) / (C.jog - C.walk); add(cur.walk, 1 - t); add(cur.jog, t);
    rate = lerp(cyc(cur.walk, speed), cyc(cur.jog, speed), t);
  } else {
    const t = clamp((speed - C.jog) / (C.sprint - C.jog), 0, 1); add(cur.jog, 1 - t); add(cur.sprint, t);
    rate = lerp(cyc(cur.jog, speed), cyc(cur.sprint, speed), t);
  }
  if (mode === 'air') rate *= 0.35;
  phase = (phase + rate * dt) % 1;
  const locoW = updateOvr(dt);
  for (const a of locoActive) a.setEffectiveWeight(0);
  const split = armed && !crouch;
  if (split) {
    const st = useLoop(masked(cur.stance || 'Sword_Idle', false));
    if (st) { st.timeScale = 1; st.setEffectiveWeight(locoW); }
  }
  for (const [rawId, w] of wts) {
    const id = split ? masked(rawId, true) : rawId;
    const a = useLoop(id); if (!a) continue;
    if (cal[id]) { a.timeScale = 0; a.time = ((phase + cal[id].strike) % 1) * cal[id].dur; }
    else a.timeScale = 1;
    a.setEffectiveWeight(w * locoW);
  }
  mixer.update(dt);
}

const camPos = new V3(), right = new V3();
function updateCamera(dt, C) {
  const sprintT = clamp((speed - C.jog) / (C.sprint - C.jog), 0, 1);
  const h = mode === 'slide' ? 1.05 : crouch ? 1.15 : 1.55;
  pivot.x = damp(pivot.x, player.position.x, 14, dt);
  pivot.z = damp(pivot.z, player.position.z, 14, dt);
  pivot.y = damp(pivot.y, player.position.y + h, mode === 'air' ? 5 : 10, dt);
  const narrow = clamp(camera.aspect, 0.45, 1);
  const dist = (camDist + 0.6 * sprintT) * (1 + (1 - narrow) * 0.9);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const lx = Math.sin(camYaw) * cp, ly = -sp, lz = Math.cos(camYaw) * cp;
  right.set(-Math.cos(camYaw), 0, Math.sin(camYaw)).multiplyScalar(0.42 * narrow * narrow);
  camPos.set(pivot.x - lx * dist + right.x, Math.max(0.2, pivot.y - ly * dist), pivot.z - lz * dist + right.z);
  camera.position.copy(camPos);
  camera.lookAt(pivot.x + right.x, pivot.y, pivot.z + right.z);
  const fov = lerp(55, klass === 'force' ? 66 : 62, sprintT);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = damp(camera.fov, fov, 4, dt); camera.updateProjectionMatrix(); }
}

let hudN = 0;
function hud(C) {
  if ((hudN += 1) % 6) return;
  $('spd').textContent = speed.toFixed(1);
  const g = blocking ? 'Block' : atk ? (atk.heavy ? 'Heavy attack' : 'Attack ' + (atk.i + 1)) :
    mode === 'air' ? (jumps === 2 ? 'Double jump' : 'Airborne') : mode === 'slide' ? 'Slide' :
    { idle: 'Idle', walk: 'Walk', jog: 'Run', sprint: 'Sprint', crouch: 'Crouch', crouchwalk: 'Crouch' }[gait];
  const el = $('gait'); el.textContent = g; el.classList.toggle('hot', g === 'Sprint' || g === 'Slide' || g === 'Double jump');
}

// ---------------- class + Moves screen ----------------
function renderClass() {
  const C = CLASSES[klass];
  $('classname').textContent = C.label;
  $('classstats').textContent = `${C.health} HP · sprint ${C.sprint} m/s${C.doubleJump ? ' · 2× jump' : ''}`;
}

let movesOpen = false, previewing = null, pvTimer = 0, savedCam = null, movesWasArmed = false;
function openMoves() {
  if (movesOpen) return;
  movesOpen = true; document.body.classList.add('moves-open');
  movesWasArmed = armed && igniteTarget === 1; atk = null; blocking = false;
  $('moves').hidden = false;
  if (isLocked()) document.exitPointerLock?.();
  keys.clear(); joy.id = null; $('joy').hidden = true;
  speed = 0; mode = 'ground'; crouch = false; player.position.y = 0; stopOvr(0.1);
  savedCam = { camYaw, camPitch, camDist };
  const wide = innerWidth >= 820;
  camYaw = yaw + Math.PI; camPitch = 0.1; camDist = wide ? 3.8 : 5.4;
  viewShift = wide ? { x: 200 / innerWidth, y: 0 } : { x: 0, y: 0.28 };
  resize();
  const last = previewing || { kind: 'slot', slot: 'sprint', id: pool.sprint[0] };
  preview(last);
}
function closeMoves() {
  if (!movesOpen) return;
  movesOpen = false; document.body.classList.remove('moves-open');
  $('moves').hidden = true; $('pvlabel').hidden = true;
  clearTimeout(pvTimer); stopOvr(0.2);
  if (!movesWasArmed && armed) setArmed(false, true);
  if (savedCam) ({ camYaw, camPitch, camDist } = savedCam);
  viewShift = { x: 0, y: 0 }; resize();
  for (const s of ['idle', 'walk', 'jog', 'sprint', 'crouch', 'stance']) cur[s] = null;
  pickGaitVariants(true);
}

// Play a move in place. Sequences (jump, slide) loop start → hold → end.
function preview(p) {
  previewing = p;
  const swordy = p.slot === 'stance' || /^(Sword|STANCE|M2M_Defend|M2M_Sword)/.test(p.id);
  if (swordy) setArmed(true, true);
  else if (!movesWasArmed && armed) setArmed(false, true);
  clearTimeout(pvTimer);
  document.querySelectorAll('[data-pv]').forEach((el) => el.classList.toggle(el.matches('.row') ? 'previewing' : 'on', el.dataset.pv === p.key));
  let label, seq;
  if (p.kind === 'lib') { label = p.id.replace(/^M2M_/, '').replace(/_/g, ' '); seq = [p.id]; }
  else { const v = variantById(p.slot, p.id); label = `${MOVES[p.slot].label}: ${v.label}`; seq = v.seq || [v.id]; }
  $('pvlabel').textContent = 'Previewing · ' + label; $('pvlabel').hidden = false;
  const once = (i) => {
    if (!movesOpen || previewing !== p) return;
    if (i >= seq.length) { pvTimer = setTimeout(() => once(0), 500); return; }
    const name = seq[i], c = clips.get(name);
    if (!c) return;
    const isLoop = /_Loop$|Idle$|^STANCE_|^M2M_(Run|Walk|Strafe|Glide|Flying|Levitate_Idle|Idle|Fighting)/.test(name) || (seq.length === 1 && !p.oneshot);
    if (seq.length === 1 && isLoop) { playOvr(name, { loop: true, fade: 0.2 }); return; }
    if (isLoop) { playOvr(name, { loop: true, fade: 0.15 }); pvTimer = setTimeout(() => once(i + 1), 900); return; }
    playOvr(name, { fade: 0.12, then: () => once(i + 1) });
  };
  once(0);
}

function buildMoves() {
  const body = $('movesbody');
  const h = [];
  h.push(`<h3>Class <small>your rules for now</small></h3><div class="seg" role="group" aria-label="Class">`);
  for (const [k, C] of Object.entries(CLASSES)) h.push(`<button type="button" data-class="${k}" aria-pressed="${k === klass}">${C.label}</button>`);
  h.push(`</div><p class="stats" id="classdetail"></p>`);
  h.push(`<h3>Saber <small>E / Saber button to ignite</small></h3><div class="seg" role="group" aria-label="Saber style">`);
  for (const [k, l] of [['single', 'Single'], ['dual', 'Dual'], ['staff', 'Staff']]) h.push(`<button type="button" data-sstyle="${k}" aria-pressed="${saberCfg.style === k}">${l}</button>`);
  h.push(`</div><div class="seg" role="group" aria-label="Grip" style="margin-top:8px;grid-template-columns:repeat(2,1fr)">`);
  for (const [k, l] of [['normal', 'Normal grip'], ['reverse', 'Reverse grip (Ahsoka)']]) h.push(`<button type="button" data-sgrip="${k}" aria-pressed="${saberCfg.grip === k}">${l}</button>`);
  h.push(`</div><div class="swatches" role="group" aria-label="Blade colour" style="margin-top:8px">`);
  for (const [k, c] of Object.entries(SABER_COLORS)) h.push(`<button type="button" data-scolor="${k}" aria-pressed="${saberCfg.color === k}"><i style="background:#${c.toString(16).padStart(6, '0')}"></i>${k}</button>`);
  h.push(`</div><p class="note">Tap Attack for a three-hit chain (A → B → C), hold it for the heavy combo, hold Block to guard. Previews below show the saber lit.</p>`);
  for (const [slot, m] of Object.entries(MOVES)) {
    h.push(`<h3>${m.label} <small>${m.variants.length} found</small></h3>`);
    for (const v of m.variants) {
      const key = `${slot}:${v.id}`;
      h.push(`<div class="row" data-pv="${key}"><button type="button" class="pv" data-slot="${slot}" data-id="${v.id}"><b>${v.label}</b><span>${v.src}${cal[v.id] ? ` · ${cal[v.id].speed.toFixed(1)} m/s natural` : ''}</span></button>` +
        `<label><input type="checkbox" id="rot-${slot}-${v.id}" data-slot="${slot}" data-id="${v.id}" ${pool[slot].includes(v.id) ? 'checked' : ''}> In play</label></div>`);
    }
    h.push(`<p class="note">${m.when}.</p>`);
  }
  h.push(`<h3>Library <small>preview only, not on controls yet</small></h3><div class="lib">`);
  for (const id of LIBRARY) if (clips.has(id)) h.push(`<button type="button" data-lib="${id}" data-pv="lib:${id}">${id.replace(/^M2M_/, '').replace(/_Loop$/, '').replace(/_/g, ' ')}</button>`);
  h.push(`</div><p class="note">Sword, pistol, throw and hit clips are here for the lightsaber, rifle and grenade work later. More variants (knee slide, extra sprints, flips) come from Mixamo once you download them. The list is in the plan.</p>`);
  body.innerHTML = h.join('');
  renderClassDetail();
  body.addEventListener('click', (e) => {
    const sb = e.target.closest('[data-sstyle],[data-sgrip],[data-scolor]');
    if (sb) {
      if (sb.dataset.sstyle) saberCfg.style = sb.dataset.sstyle;
      if (sb.dataset.sgrip) saberCfg.grip = sb.dataset.sgrip;
      if (sb.dataset.scolor) saberCfg.color = sb.dataset.scolor;
      saveSaber(); rebuildSabers();
      for (const [attr, key] of [['sstyle', 'style'], ['sgrip', 'grip'], ['scolor', 'color']])
        body.querySelectorAll(`[data-${attr}]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === saberCfg[key])));
      setArmed(true, true);
      preview({ kind: 'slot', slot: 'stance', id: pool.stance[0], key: `stance:${pool.stance[0]}` });
      return;
    }
    const cb = e.target.closest('[data-class]');
    if (cb) { klass = cb.dataset.class; try { localStorage.setItem('moves-class', klass); } catch (_) {}
      body.querySelectorAll('[data-class]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.class === klass))); renderClass(); renderClassDetail(); return; }
    const pv = e.target.closest('.pv');
    if (pv) { preview({ kind: 'slot', slot: pv.dataset.slot, id: pv.dataset.id, key: `${pv.dataset.slot}:${pv.dataset.id}` }); return; }
    const lb = e.target.closest('[data-lib]');
    if (lb) preview({ kind: 'lib', id: lb.dataset.lib, key: `lib:${lb.dataset.lib}`, oneshot: !/_Loop$|Idle$|^M2M_(Walk|Strafe|Glide|Flying|Levitate_Idle)/.test(lb.dataset.lib) });
  });
  body.addEventListener('change', (e) => {
    const i = e.target; if (!i.matches('input[type=checkbox]')) return;
    const { slot, id } = i.dataset;
    const p = pool[slot];
    if (i.checked) { if (!p.includes(id)) p.push(id); }
    else if (p.length > 1) p.splice(p.indexOf(id), 1);
    else { i.checked = true; toast('Keep at least one ' + MOVES[slot].label.toLowerCase() + ' in play'); }
    rot[slot] = -1; savePool();
    preview({ kind: 'slot', slot, id, key: `${slot}:${id}` });
  });
}
function renderClassDetail() {
  const C = CLASSES[klass];
  $('classdetail').textContent = `${C.who}. Walk ${C.walk} · run ${C.jog} · sprint ${C.sprint} m/s (no stamina limit). ` +
    `Jump ${C.doubleJump ? '+ double jump' : 'single'}. Slide ${C.slideTime}s. ${C.health} HP (not used until combat).`;
}

// ---------------- loop ----------------
const timer = new THREE.Timer();
function start() {
  pickGaitVariants(true);
  renderer.setAnimationLoop((t) => {
    timer.update(t);
    const dt = Math.min(timer.getDelta(), 0.05);
    if (movesOpen) {
      updateSaber(dt);
      const locoW = updateOvr(dt);
      for (const a of locoActive) a.setEffectiveWeight(0);
      if (locoW > 0.01) { const a = useLoop(cur.idle); a.timeScale = 1; a.setEffectiveWeight(locoW); }
      mixer.update(dt);
      pivot.set(player.position.x, 1.0, player.position.z);
      const cp = Math.cos(camPitch);
      camera.position.set(pivot.x - Math.sin(camYaw) * cp * camDist, pivot.y + Math.sin(camPitch) * camDist, pivot.z - Math.cos(camYaw) * cp * camDist);
      camera.lookAt(pivot);
    } else step(dt);
    renderer.render(scene, camera);
  });
  window.__game = { get armed() { return armed; }, get atk() { return atk && (atk.heavy ? 'H' : atk.i); }, get blocking() { return blocking; }, setArmed, attackPress, attackRelease, blockPress, blockRelease, get speed() { return speed; }, get mode() { return mode; }, get gait() { return gait; }, get jumps() { return jumps; },
    setClass(k) { klass = k; renderClass(); }, openMoves, closeMoves };
}
</script>
